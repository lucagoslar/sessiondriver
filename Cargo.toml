[package]
name = "sessiondriver"
version = "0.1.2"
edition = "2024"

[dependencies]
tokio = { version = "= 1.52.3", features = [
    "rt-multi-thread",
    "tokio-macros",
    "tracing",
    "process",
    "signal",
    "sync",
] }
log = "= 0.4.29"
env_logger = "= 0.11.10"
clap = { version = "= 4.6.1", features = ["derive", "env"] }
axum = { version = "= 0.8.9", features = ["macros"] }
humantime = "= 2.3.0"
async-lock = "= 3.4.2"
reqwest = { version = "= 0.13.3", features = [
    "stream",
    "json",
    "rustls",
    "charset",
    "http2",
], default-features = false }
serde = { version = "= 1.0.228", features = ["derive"] }
serde_json = "= 1.0.149"
uuid = { version = "= 1.23.1", features = ["serde"] }
fantoccini = { version = "= 0.22.1", features = [
    "rustls-tls",
], default-features = false }
deadpool = "= 0.13.0"
rustls = { version = "= 0.23.40", features = ["ring"] }
